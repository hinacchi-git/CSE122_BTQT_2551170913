<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calender</title>
</head>
<link rel="stylesheet" href="Bai12.css">
<body>
    <div class="first-box">
        <p class="year">2026</p>
        <p class="month">Tháng 12</p>
        <p class="date">24</p>
        <p class="day">Thứ hai</p>
    </div>

    <div class="good-day">Chào buổi sáng!</div>

    <div class="container">
        <button>In lịch</button>
        <div class="text-box">
            <p>Ngày</p>
            <p>Tháng</p>
            <p>Năm</p>
        </div>

        <div class="box">
            <input type="number" name="date" >
            <input type="number" name="month" >
            <input type="number" name="year" >
        </div>
    </div>
<script src = "Bai12.js"></script>
</body>
</html>
