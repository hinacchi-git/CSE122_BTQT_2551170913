<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Images library</title>
    <link rel="stylesheet" href="Bai14.css">
</head>
<body>
    <div class="header">
        <div class="head">
            6 kỳ quan thiên nhiên Việt Nam
        </div>
        <div class="sub">
            Việt Nam sở hữu nhiều kỳ quan thiên nhiên được thế giới 
            công nhận - từ vịnh biển, hang động đến núi cao và miền sông nước
        </div>
    </div>

    <div class="container">
        <div class="pic">
            <figure>
                <img src="1-vinh-ha-long.jpg" > <figcaption><p>1. Vịnh Hạ Long</p>
                Gần 2000 đảo đá vôi, Di sản thiên nhiên thế giới, thuộc Quảng Ninh.
           </figcaption>
                
            </figure>
        </div>

        <div class="pic">
            <figure>
                <img src="sondoong.webp"> <figcaption><p>2. Hang Sơn Đoòng</p>
                Hang động tự nhiên lớn nhất thế giới, thuộc Quảng Bình.
           </figcaption>
            </figure>
        </div>

        <div class="pic">
            <figure>
                <img src="3-thac-ban-gioc.jpg"  > <figcaption ><p>3. Thác Bản Giốc</p>
                Thác nước đẹp nhất Việt Nam, nằm ở Cao Bằng
           </figcaption>
            </figure>
        </div>

        <div class="pic">
            <figure>
                <img src="4-fansipan.jpg" > <figcaption><p>4. Fansipan</p>
               "Mái nhà Đông Dương", cao 3.147m , thuộc Lào Cai.
           </figcaption>
            </figure>
        </div>

        <div class="pic">
            <figure>
                <img src="5-mekong.jpg" ><figcaption><p>5. Đồng bằng sông Cửu Long</p>
                Vựa lúa, miệt vườn sông nước trù phú miền Nam.
           </figcaption>
            </figure>
        </div>

        <div class="pic">
            <figure>
                <img src="6-phong-nha.jpg" > <figcaption><p>6. Động Phong Nha</p>
                Hệ thống hang kỳ vĩ, Di sản thiên nhiên thế giới.
           </figcaption>
            </figure>
        </div>
    </div>
</body>
</html>
