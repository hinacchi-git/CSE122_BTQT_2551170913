<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator UI</title>
    <link rel="stylesheet" href="Bai15.css">
</head>
<body>
    <div class="calculator">
        <!-- Màn hình hiển thị -->
        <div class="display">
            <div class="history">12 + 8 × 3</div>
            <div class="result">36</div>
        </div>

        <!-- Bàn phím -->
        <div class="keypad">
            <button class="btn btn-clear">C</button>
            <button class="btn btn-operator">( )</button>
            <button class="btn btn-operator">%</button>
            <button class="btn btn-operator">÷</button>

            <button class="btn">7</button>
            <button class="btn">8</button>
            <button class="btn">9</button>
            <button class="btn btn-operator">×</button>

            <button class="btn">4</button>
            <button class="btn">5</button>
            <button class="btn">6</button>
            <button class="btn btn-operator">-</button>

            <button class="btn">1</button>
            <button class="btn">2</button>
            <button class="btn">3</button>
            <button class="btn btn-operator">+</button>

            <button class="btn btn-zero">0</button>
            <button class="btn">.</button>
            <button class="btn btn-equal">=</button>
        </div>
    </div>
    <script src="Bai15.js"></script>
</body>
</html>
