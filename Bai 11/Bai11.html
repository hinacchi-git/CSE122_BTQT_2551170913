<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Images library</title>
    <link rel="stylesheet" href="Bai11.css">
</head>
<body>
    <div class="header">
        <p>
            <b>Thư viện ảnh Việt Nam</b> <br>
            Bộ sưu tập 6 danh thắng tiêu biểu - minh họa thẻ figure / figcaption.
        </p>
    </div>

    <div class="container">
        <div class="pic">
            <figure>
                <img src="1-vinh-ha-long.jpg" > <figcaption>Hình 1. Vịnh Hạ Long</figcaption>
            </figure>
        </div>

        <div class="pic">
            <figure>
                <img src="sondoong.webp"> <figcaption>Hình 2. Hang Sơn Đoòng</figcaption>
            </figure>
        </div>

        <div class="pic">
            <figure>
                <img src="3-thac-ban-gioc.jpg" class = "fix" > <figcaption class ="fix">Hình 3. Thác Bản Giốc</figcaption>
            </figure>
        </div>

        <div class="pic">
            <figure>
                <img src="4-fansipan.jpg" > <figcaption>Hình 4. Fansipan</figcaption>
            </figure>
        </div>

        <div class="pic">
            <figure>
                <img src="5-mekong.jpg" > <figcaption>Hình 5. Đồng bằng sông Cửu Long</figcaption>
            </figure>
        </div>

        <div class="pic">
            <figure>
                <img src="6-phong-nha.jpg" > <figcaption>Hình 6. Động Phong Nha</figcaption>
            </figure>
        </div>
    </div>
</body>
</html>
